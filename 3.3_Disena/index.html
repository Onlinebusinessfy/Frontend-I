<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3.3 Diseña: Método para agregar empleados</title>
<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<header>
    <h1 class="text-center mb-4">3.3 Diseña: Método para agregar empleados</h1>    
</header>
<body>
    <div class="container mt-5">

        <div class="card p-4 shadow">
            <input id="nombre" class="form-control mb-2" placeholder="Nombre">
            <input id="puesto" class="form-control mb-2" placeholder="Puesto">
            <input id="salario" type="number" class="form-control mb-2" placeholder="Salario">
            <input id="identificador" class="form-control mb-3" placeholder="Identificador">

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" onclick="agregar()">Agregar</button>
                <button class="btn btn-danger" onclick="eliminar()">Eliminar</button>
                <button class="btn btn-warning" onclick="mostrar()">Mostrar</button>
                <button class="btn btn-info" onclick="filtrar()">Filtrar</button>
                <button class="btn btn-success" onclick="ordenar()">Ordenar</button>
            </div>
        </div>

        <div id="resultado" class="mt-4"></div>
    </div>
</body>
<script src="script.js"></script>
</html>
