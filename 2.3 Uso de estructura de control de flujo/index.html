<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluador de Números</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h2>Evaluador de Números</h2>

    <input type="text" id="numeroInput" placeholder="Ingresa un número">

    <div>
        <button onclick="procesarNumero()">Evaluar</button>
        <button onclick="limpiar()">Limpiar</button>
    </div>

    <p id="resultado"></p>

    <p id="contador"></p>
    <p id="mayorNumero"></p>

    <h3>Historial</h3>
    <ul id="historial"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
